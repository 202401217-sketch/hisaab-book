<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111110">
  <meta name="color-scheme" content="dark">
  <title>Hisaab Book</title>
  <meta name="description" content="Sort your bank statements into categories and keep a monthly budget.">
  <!-- Installable app (Add to Home Screen) -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hisaab">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:wght@600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar">
  <div class="wrap top">
    <button type="button" class="brand" data-act="go" data-tab="sort" aria-label="Hisaab Book, go to Sort"><span class="wm">Hisaab</span><span class="wm-sub">Book</span></button>
    <span class="sync" id="sync" data-state="idle" role="status">Opening…</span>
    <button type="button" class="btn small" data-act="import" aria-label="Import a statement"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"/></svg><span class="lbl">Import</span></button>
  </div>
  <nav class="wrap tabs" role="tablist" aria-label="Sections">
    <button type="button" class="tab" role="tab" id="tab-sort" data-act="go" data-tab="sort" aria-selected="true">Sort <span class="badge" id="badge-sort"></span></button>
    <button type="button" class="tab" role="tab" id="tab-budget" data-act="go" data-tab="budget" aria-selected="false">Budget</button>
    <button type="button" class="tab" role="tab" id="tab-history" data-act="go" data-tab="history" aria-selected="false">History</button>
    <button type="button" class="tab" role="tab" id="tab-categories" data-act="go" data-tab="categories" aria-selected="false">Categories</button>
  </nav>
</div>
<main class="wrap" id="view" role="tabpanel" aria-labelledby="tab-sort"><p class="loading">Opening your book…</p></main>
<div id="sheet-root"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden><span></span><button type="button">Undo</button></div>
<input type="file" id="backup-input" class="visually-hidden" accept=".json,application/json" tabindex="-1" aria-hidden="true">

<script src="app.js"></script>
</body>
</html>
